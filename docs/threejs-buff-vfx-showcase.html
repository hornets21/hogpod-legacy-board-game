<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Three.js Buff VFX Showcase</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080612;font-family:Arial,sans-serif}canvas{display:block}
.hud{position:fixed;top:12px;left:12px;z-index:10;color:#fff;background:#0b0a1ddd;border:1px solid #ffffff20;padding:11px 13px;border-radius:12px;line-height:1.45}
.status{position:fixed;top:12px;right:12px;z-index:10;color:#fff;background:#0b0a1ddd;padding:11px 13px;border-radius:12px;min-width:180px}
.panel{position:fixed;left:50%;bottom:10px;transform:translateX(-50%);z-index:20;width:min(1150px,calc(100% - 18px));max-height:38vh;overflow:auto;padding:11px;background:#0b0a1df0;border:1px solid #ffffff22;border-radius:14px}
.buttons{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:7px}
button{border:0;border-radius:9px;padding:10px 7px;background:#523aa0;color:white;font-weight:700;cursor:pointer}button:hover{filter:brightness(1.15)}
</style></head>
<body>
<div class="hud"><b>Buff / Support VFX Showcase</b><br>Cast Burst → Buff Applied → Looping Status</div>
<div class="status"><b>ACTIVE BUFF</b><div id="status">None</div></div>
<div class="panel"><div class="buttons" id="buttons"></div></div>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from "three";
import {OrbitControls} from "three/addons/controls/OrbitControls.js";

const scene=new THREE.Scene();scene.background=new THREE.Color(0x090716);scene.fog=new THREE.Fog(0x090716,24,50);
const camera=new THREE.PerspectiveCamera(42,innerWidth/innerHeight,.1,120);camera.position.set(0,9,15);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;renderer.outputColorSpace=THREE.SRGBColorSpace;document.body.appendChild(renderer.domElement);
const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.target.set(0,1.2,0);
scene.add(new THREE.HemisphereLight(0xb9caff,0x25162c,2.5));const sun=new THREE.DirectionalLight(0xffffff,2.5);sun.position.set(-7,14,8);sun.castShadow=true;scene.add(sun);

function mat(c,e=0,i=0){return new THREE.MeshStandardMaterial({color:c,emissive:e,emissiveIntensity:i,roughness:.8,flatShading:true})}
function dispose(m){m.geometry?.dispose();if(m.material){Array.isArray(m.material)?m.material.forEach(x=>x.dispose()):m.material.dispose()}}
const arena=new THREE.Mesh(new THREE.CircleGeometry(7.5,40),mat(0x4b4653));arena.rotation.x=-Math.PI/2;arena.receiveShadow=true;scene.add(arena);
const outer=new THREE.Mesh(new THREE.RingGeometry(5.8,6.1,40),mat(0x76677f));outer.rotation.x=-Math.PI/2;outer.position.y=.02;scene.add(outer);

const fighter=new THREE.Group();
const body=new THREE.Mesh(new THREE.IcosahedronGeometry(1,0),mat(0x4b8fff));body.position.y=1.1;body.scale.set(1.15,1.15,1.35);body.castShadow=true;
const head=new THREE.Mesh(new THREE.IcosahedronGeometry(.55,0),mat(0x4b8fff));head.position.set(0,1.85,-.45);
const horn1=new THREE.Mesh(new THREE.ConeGeometry(.14,.65,5),mat(0xe9ddff));horn1.position.set(-.3,2.3,-.48);
const horn2=horn1.clone();horn2.position.x=.3;fighter.add(body,head,horn1,horn2);scene.add(fighter);

const fx=new THREE.Group(),persistent=new THREE.Group();scene.add(fx,persistent);
let activeAnim=null,activeName="None";
const status=document.getElementById("status");

function clearPersistent(){while(persistent.children.length){const o=persistent.children.pop();o.traverse?.(dispose)}activeAnim=null}
function setBuff(name){activeName=name;status.textContent=name}
function center(y=1){return new THREE.Vector3(0,y,0)}

function particles(color,count=35,radius=1.4,height=3){
 for(let i=0;i<count;i++){const m=new THREE.Mesh(new THREE.OctahedronGeometry(.06+Math.random()*.06,0),new THREE.MeshBasicMaterial({color,transparent:true,opacity:.9}));const a=Math.random()*Math.PI*2,r=Math.random()*radius;m.position.set(Math.cos(a)*r,Math.random()*height,Math.sin(a)*r);fx.add(m);const s=performance.now(),speed=.8+Math.random();
 function tick(now){const p=Math.min((now-s)/800,1);m.position.y+=.025*speed;m.material.opacity=1-p;if(p<1)requestAnimationFrame(tick);else{fx.remove(m);dispose(m)}}requestAnimationFrame(tick)}
}

function castRing(color){
 const r=new THREE.Mesh(new THREE.RingGeometry(.65,1.0,48),new THREE.MeshBasicMaterial({color,transparent:true,opacity:.95,side:THREE.DoubleSide,depthWrite:false}));r.rotation.x=-Math.PI/2;r.position.y=.05;fx.add(r);const s=performance.now();
 function tick(now){const p=Math.min((now-s)/650,1);r.scale.setScalar(.3+p*2.3);r.rotation.z+=.09;r.material.opacity=1-p;if(p<1)requestAnimationFrame(tick);else{fx.remove(r);dispose(r)}}requestAnimationFrame(tick)
}

function pulseSphere(color){
 const m=new THREE.Mesh(new THREE.SphereGeometry(1.45,20,12),new THREE.MeshBasicMaterial({color,transparent:true,opacity:.45,wireframe:true}));m.position.y=1.25;fx.add(m);const s=performance.now();
 function tick(now){const p=Math.min((now-s)/550,1);m.scale.setScalar(.3+p*1.3);m.material.opacity=.55*(1-p);if(p<1)requestAnimationFrame(tick);else{fx.remove(m);dispose(m)}}requestAnimationFrame(tick)
}

function orbitBuff(color,count=3,shape="orb"){
 clearPersistent();
 const items=[];
 for(let i=0;i<count;i++){let geo=shape==="shield"?new THREE.OctahedronGeometry(.22,0):new THREE.SphereGeometry(.12,8,6);const m=new THREE.Mesh(geo,new THREE.MeshBasicMaterial({color,transparent:true,opacity:.8}));persistent.add(m);items.push(m)}
 activeAnim=t=>items.forEach((m,i)=>{const a=t*1.7+i*Math.PI*2/count;m.position.set(Math.cos(a)*1.25,1.15+.25*Math.sin(t*2+i),Math.sin(a)*1.25);m.rotation.y+=.04});
}

function attackUp(){setBuff("Attack Up");castRing(0xff554f);particles(0xff6a4d,40);clearPersistent();const arrows=[];for(let i=0;i<4;i++){const m=new THREE.Mesh(new THREE.ConeGeometry(.13,.45,5),new THREE.MeshBasicMaterial({color:0xff5a4f}));persistent.add(m);arrows.push(m)}activeAnim=t=>arrows.forEach((m,i)=>{const a=i*Math.PI/2;m.position.set(Math.cos(a)*1.15,.4+((t*.8+i*.3)%1)*2.2,Math.sin(a)*1.15);m.rotation.z=Math.PI})}
function defenseUp(){setBuff("Defense Up");castRing(0x65aaff);pulseSphere(0x65aaff);orbitBuff(0x7db8ff,4,"shield")}
function speedUp(){setBuff("Speed Up");castRing(0x65efff);particles(0x8ef6ff,28);clearPersistent();const rings=[];for(let i=0;i<3;i++){const r=new THREE.Mesh(new THREE.TorusGeometry(.8+i*.18,.035,5,24),new THREE.MeshBasicMaterial({color:0x70e9ff,transparent:true,opacity:.65}));r.rotation.x=Math.PI/2;persistent.add(r);rings.push(r)}activeAnim=t=>rings.forEach((r,i)=>{r.position.y=.5+i*.5;r.rotation.z-=.08+i*.015;r.scale.setScalar(1+.08*Math.sin(t*5+i))})}
function magicUp(){setBuff("Magic Up");castRing(0xa768ff);particles(0xc28aff,35);orbitBuff(0xc080ff,5)}
function critUp(){setBuff("Critical Up");castRing(0xffd65a);particles(0xffe37d,42);orbitBuff(0xffd45a,3)}
function heal(){setBuff("Heal");castRing(0x65ef8b);particles(0x75f29a,55);pulseSphere(0x5be987);clearPersistent()}
function regen(){setBuff("Regeneration");castRing(0x64e883);particles(0x7af29b,32);clearPersistent();const r=new THREE.Mesh(new THREE.TorusGeometry(1.1,.05,6,28),new THREE.MeshBasicMaterial({color:0x6eed8c,transparent:true,opacity:.7}));r.rotation.x=Math.PI/2;persistent.add(r);activeAnim=t=>{r.position.y=.65+.15*Math.sin(t*2);r.rotation.z+=.025}}
function shield(){setBuff("Shield");castRing(0x63b9ff);pulseSphere(0x63b9ff);clearPersistent();const b=new THREE.Mesh(new THREE.SphereGeometry(1.55,20,12),new THREE.MeshBasicMaterial({color:0x6ac5ff,wireframe:true,transparent:true,opacity:.3}));b.position.y=1.25;persistent.add(b);activeAnim=t=>{b.rotation.y+=.012;b.scale.setScalar(1+.025*Math.sin(t*3))}}
function reflect(){setBuff("Reflect");castRing(0xb68aff);clearPersistent();const rs=[];for(let i=0;i<4;i++){const m=new THREE.Mesh(new THREE.PlaneGeometry(.55,.75),new THREE.MeshBasicMaterial({color:0xd6b7ff,transparent:true,opacity:.55,side:THREE.DoubleSide}));persistent.add(m);rs.push(m)}activeAnim=t=>rs.forEach((m,i)=>{const a=t+i*Math.PI/2;m.position.set(Math.cos(a)*1.35,1.2,Math.sin(a)*1.35);m.lookAt(0,1.2,0)})}
function rage(){setBuff("Rage");castRing(0xff382f);particles(0xff4c32,55);clearPersistent();const aura=new THREE.Mesh(new THREE.ConeGeometry(1.5,3.2,8,1,true),new THREE.MeshBasicMaterial({color:0xff3c2e,transparent:true,opacity:.16,wireframe:true}));aura.position.y=1.6;persistent.add(aura);activeAnim=t=>{aura.rotation.y+=.04;aura.scale.setScalar(1+.07*Math.sin(t*7))}}
function haste(){setBuff("Haste");castRing(0x56e9ff);speedUp();setBuff("Haste")}
function stealth(){setBuff("Stealth");castRing(0x8c8da8);particles(0xaaaac0,30);clearPersistent();fighter.traverse(o=>{if(o.material){o.material.transparent=true;o.material.opacity=.35}})}
function invincible(){fighter.traverse(o=>{if(o.material)o.material.opacity=1});setBuff("Invincible");castRing(0xffdc62);particles(0xffe88b,50);clearPersistent();const halo=new THREE.Mesh(new THREE.TorusGeometry(.7,.08,8,32),new THREE.MeshBasicMaterial({color:0xffdf62}));halo.rotation.x=Math.PI/2;persistent.add(halo);const barrier=new THREE.Mesh(new THREE.SphereGeometry(1.65,16,10),new THREE.MeshBasicMaterial({color:0xffd95c,wireframe:true,transparent:true,opacity:.25}));barrier.position.y=1.25;persistent.add(barrier);activeAnim=t=>{halo.position.y=2.75+.08*Math.sin(t*3);halo.rotation.z+=.03;barrier.rotation.y+=.012}}
function cleanse(){fighter.traverse(o=>{if(o.material)o.material.opacity=1});setBuff("Cleanse");clearPersistent();castRing(0xffffff);particles(0xffffff,65);pulseSphere(0xffffff)}
function revive(){fighter.traverse(o=>{if(o.material)o.material.opacity=1});setBuff("Revive");clearPersistent();castRing(0xffe785);particles(0xffec9e,75);const base=fighter.position.y;fighter.position.y=-1;const s=performance.now();function tick(now){const p=Math.min((now-s)/1000,1);fighter.position.y=-1+p;if(p<1)requestAnimationFrame(tick);else fighter.position.y=base}requestAnimationFrame(tick);invincible();setBuff("Revive + Invincible")}
function clear(){fighter.traverse(o=>{if(o.material){o.material.transparent=false;o.material.opacity=1}});clearPersistent();setBuff("None")}

const demos=[["⚔ Attack Up",attackUp],["🛡 Defense Up",defenseUp],["💨 Speed Up",speedUp],["🔮 Magic Up",magicUp],["⭐ Crit Up",critUp],["💚 Heal",heal],["🌿 Regen",regen],["🔵 Shield",shield],["🪞 Reflect",reflect],["🔥 Rage",rage],["⚡ Haste",haste],["👻 Stealth",stealth],["✨ Invincible",invincible],["🧼 Cleanse",cleanse],["🌟 Revive",revive],["✖ Clear Buff",clear]];
const buttons=document.getElementById("buttons");demos.forEach(([n,fn])=>{const b=document.createElement("button");b.textContent=n;b.onclick=fn;buttons.appendChild(b)});

const clock=new THREE.Clock();
function animate(){requestAnimationFrame(animate);const t=clock.getElapsedTime();if(activeAnim)activeAnim(t);controls.update();renderer.render(scene,camera)}animate();
addEventListener("resize",()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
